baseURL = "https://giteshjawale96.github.io/"
languageCode = "en-us"
title = "Gitesh Jawale | AI Infrastructure & Platform Engineer"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 40
paginate = 10
copyright = "Gitesh Jawale"

[params]
  author        = "Gitesh Jawale"
  description   = "AI Infrastructure & Platform Engineer. Writing about Kubernetes, LLM infrastructure, SRE, Platform Engineering, and Observability."
  tagline       = "AI Infrastructure & Platform Engineer"
  subtagline    = "Kubernetes · LLM Infrastructure · SRE · Platform Engineering · Observability"
  email         = "gitesh@example.com"
  github        = "https://github.com/giteshjawale"
  linkedin      = "https://linkedin.com/in/giteshjawale"
  twitter       = "https://twitter.com/giteshjawale"
  twitterHandle = "@giteshjawale"
  avatarURL     = "/images/avatar.jpg"
  ogImage       = "/images/og-default.png"
  dateFormat    = "January 2, 2006"
  showReadingTime = true
  showTOC       = true

[markup]
  [markup.highlight]
    style               = "github-dark"
    lineNos             = true
    lineNumbersInTable  = true
    noClasses           = false
    tabWidth            = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote       = true
    linkify        = true
    strikethrough  = true
    table          = true
    taskList       = true
    typographer    = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  term    = ["HTML", "RSS"]
  page    = ["HTML"]

[outputFormats]
  [outputFormats.JSON]
    mediaType             = "application/json"
    baseName              = "index"
    isPlainText           = true
    notAlternative        = true

[taxonomies]
  tag      = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name       = "Blog"
    url        = "/blog/"
    weight     = 1
    identifier = "blog"
  [[menu.main]]
    name       = "Projects"
    url        = "/projects/"
    weight     = 2
    identifier = "projects"
  [[menu.main]]
    name       = "Architecture"
    url        = "/architecture/"
    weight     = 3
    identifier = "architecture"
  [[menu.main]]
    name       = "About"
    url        = "/about/"
    weight     = 4
    identifier = "about"
  [[menu.main]]
    name       = "Contact"
    url        = "/contact/"
    weight     = 5
    identifier = "contact"

[sitemap]
  changefreq = "weekly"
  filename   = "sitemap.xml"
  priority   = 0.5

[params.social]
  github   = "giteshjawale"
  linkedin = "giteshjawale"

[security]
  enableInlineShortcodes = false
  [security.exec]
    allow  = ["^dart-sass-embedded$", "^go$", "^npx$", "^postcss$"]
    osEnv  = ["(?i)^(path|pathext|appdata|tmp|temp|term)$"]
  [security.funcs]
    getenv = ["^HUGO_"]
  [security.http]
    methods  = ["(?i)GET|POST"]
    urls     = [".*"]
