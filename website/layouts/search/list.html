{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1 class="page-title">Search</h1>
    <p class="page-description">Search across all articles</p>
  </div>
</div>

<div class="container section">
  <div class="search-box">
    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="Search articles, topics, tags..."
      autocomplete="off"
      autofocus
    />
  </div>

  <div id="search-results" class="posts-grid" aria-live="polite">
    <p class="search-hint" id="search-hint">Start typing to search...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
(function () {
  const input  = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  const hint   = document.getElementById('search-hint');
  let fuse;

  fetch('/index.json')
    .then(r => r.json())
    .then(data => {
      fuse = new Fuse(data, {
        keys: ['title', 'summary', 'tags'],
        threshold: 0.4,
        includeScore: true,
        minMatchCharLength: 2,
      });
    });

  function renderCard(item) {
    const tags = (item.tags || []).slice(0, 3)
      .map(t => `<a href="/tags/${t.toLowerCase().replace(/\s+/g,'-')}/" class="tag">${t}</a>`)
      .join('');
    return `
      <article class="post-card">
        <div class="post-card-body">
          <div class="post-card-meta">
            <time>${item.date}</time>
          </div>
          <h2 class="post-card-title"><a href="${item.url}">${item.title}</a></h2>
          <p class="post-card-summary">${item.summary || ''}</p>
          <div class="post-card-tags">${tags}</div>
        </div>
      </article>`;
  }

  input.addEventListener('input', function () {
    const query = this.value.trim();
    if (!fuse || query.length < 2) {
      results.innerHTML = '<p class="search-hint">Start typing to search...</p>';
      return;
    }
    const hits = fuse.search(query);
    if (hits.length === 0) {
      results.innerHTML = `<p class="search-hint">No results for "<strong>${query}</strong>"</p>`;
      return;
    }
    results.innerHTML = hits.map(h => renderCard(h.item)).join('');
  });
})();
</script>
{{ end }}
