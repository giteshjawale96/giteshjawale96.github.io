{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" aria-label="Page navigation">

  {{ if $paginator.HasPrev }}
  <a href="{{ $paginator.Prev.URL }}" class="page-btn" aria-label="Previous page">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>
  {{ else }}
  <span class="page-btn disabled" aria-disabled="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </span>
  {{ end }}

  {{ range $paginator.Pagers }}
  {{ if eq . $paginator }}
  <span class="page-btn active" aria-current="page">{{ .PageNumber }}</span>
  {{ else }}
  <a href="{{ .URL }}" class="page-btn">{{ .PageNumber }}</a>
  {{ end }}
  {{ end }}

  {{ if $paginator.HasNext }}
  <a href="{{ $paginator.Next.URL }}" class="page-btn" aria-label="Next page">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </a>
  {{ else }}
  <span class="page-btn disabled" aria-disabled="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </span>
  {{ end }}

</nav>
{{ end }}
